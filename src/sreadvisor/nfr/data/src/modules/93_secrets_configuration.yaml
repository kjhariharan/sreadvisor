id: secrets_configuration
title: Secrets and configuration management
layer: cross_cutting
category: cross_cutting
description: >-
  Whether credentials and sensitive values stay out of code and committed configuration and are sourced from an approved
  secrets manager, vault or Kubernetes secrets. Evaluated against the secrets handling data captured in Stage 1 code and infrastructure analysis.
detect:
  - always: true
recognizes:
  - dependency: "vault|keyvault|secretsmanager|secret-manager|jasypt|hvac|azure\\.security"
catalogue_refs: []
entry_extensions:
  policy_dependent: "true when the outcome depends on the organisation's secrets policy (for example plain env vars allowed or not)"
entries:
  - id: SEC-001
    title: No hardcoded credentials or sensitive values in code or committed configuration
    requirement: Source files and committed configuration contain no passwords, API keys, tokens, private keys or credentials embedded in connection strings.
    best_practice: >-
      Reference secrets by name from the environment or a secrets manager; keep only placeholders (with no default secret value)
      in committed configuration; add secret scanning to pre-commit and CI; rotate anything that was ever committed.
    audit_requirement: Secret scanning results and remediation of exposed secrets are retained.
    priority: critical
    monitoring:
      - source: platform
        signal: "secret scanning alerts in the source control platform and CI"
    verification:
      sources: [stage1_dataset]
      stage1_paths:
        - "repositories[].secrets.hardcoded[].kind"
        - "repositories[].secrets.hardcoded[].key"
        - "repositories[].secrets.hardcoded[].location_type"
        - "infrastructure.secrets.hardcoded[].kind"
      criteria: >-
        No finding of kind hardcoded_credential, private_key, credentials_in_connection_string or plaintext_secret_manifest;
        default_value_in_placeholder findings are reviewed (a default that is a real credential is a finding, a demo default is noted).
  - id: SEC-002
    title: Secrets sourced from an approved secrets manager, vault or Kubernetes secrets
    requirement: Runtime secrets come from an approved store (a secrets manager or vault, or Kubernetes secrets populated from one) and are injected at deploy or run time.
    best_practice: Prefer a secrets manager with an operator or CSI driver (external secrets) over long-lived secrets baked into manifests; scope each secret to the workload that needs it.
    audit_requirement: Secret access is logged by the secrets platform and reviewed periodically.
    priority: high
    policy_dependent: true
    monitoring:
      - source: platform
        signal: "secrets manager access logs and denied requests"
    verification:
      sources: [stage1_dataset]
      stage1_paths:
        - "repositories[].secrets.sourced_from[].mechanism"
        - "repositories[].secrets.sourced_from[].name"
        - "infrastructure.secrets.sourced_from[].mechanism"
        - "infrastructure.kubernetes_secret_definitions"
        - "infrastructure.workloads[].containers[].env_from_secrets"
      criteria: Each secret referenced by the application has a sourced_from mechanism of vault, secrets_manager, external_secrets or kubernetes_secret.
  - id: SEC-003
    title: Plain environment variables only where policy allows
    requirement: Where policy requires stronger handling than plain environment variables, secrets are delivered through a secrets manager, mounted files or an external-secrets mechanism rather than inline env values.
    best_practice: Environment variables sourced from Kubernetes secrets (secretKeyRef) are preferable to literal values; avoid printing the environment in logs or crash dumps; consider file mounts to avoid leaking through process listings.
    audit_requirement: The exception list of secrets allowed as plain env vars is approved and reviewed.
    priority: medium
    policy_dependent: true
    monitoring:
      - source: logs
        signal: "environment or configuration dumps in logs"
    verification:
      sources: [stage1_dataset, manual_review]
      stage1_paths:
        - "repositories[].secrets.sourced_from[].mechanism"
        - "infrastructure.workloads[].containers[].env_from_secrets"
        - "cross_references[].kind"
      criteria: Secrets whose only source is environment_variable are checked against the policy on stronger handling; secret_env_var_supply cross references show each variable supplied by a secret reference.
  - id: SEC-004
    title: Kubernetes Secret manifests are not committed with values
    requirement: Secret manifests in the repository contain no real values (encrypted with sealed secrets, generated by an operator, or placeholders).
    best_practice: Use sealed or external secrets; base64 is encoding, not protection; restrict RBAC on Secret objects; enable encryption of secrets at rest in etcd.
    audit_requirement: Kubernetes API audit logs capture secret reads.
    priority: critical
    monitoring:
      - source: platform
        signal: "Kubernetes audit log entries for secret get and list"
    verification:
      sources: [stage1_dataset]
      stage1_paths:
        - "infrastructure.secrets.hardcoded[].kind"
        - "infrastructure.kubernetes_secret_definitions"
        - "cross_references[].facts"
      criteria: No plaintext_secret_manifest finding; kubernetes_secret_definition cross references show inline_values_committed false.
  - id: SEC-005
    title: Credential rotation without redeploy
    requirement: Credentials can be rotated on a schedule and after a suspected leak without a code change, and the application picks up rotated values (reload, short-lived dynamic credentials, or a controlled restart).
    best_practice: Use dynamic short-lived database credentials or workload identity where available; rotate on a defined interval; test rotation.
    audit_requirement: Rotation dates are recorded and overdue rotations are reported.
    priority: medium
    monitoring:
      - source: platform
        signal: "credential age and rotation events"
      - source: logs
        signal: "authentication failures after rotation"
    verification:
      sources: [stage1_dataset, manual_review]
      stage1_paths:
        - "repositories[].secrets.sourced_from[].mechanism"
        - "repositories[].fingerprint.dependencies[].categories"
      criteria: A vault or secrets manager integration (or workload identity) is present so rotation does not need a code change.
  - id: SEC-006
    title: Environment-specific configuration is externalised
    requirement: Environment-specific and sensitive configuration is supplied through ConfigMaps, secrets or a configuration service, not baked into images or committed per-environment files with real values.
    best_practice: One artifact for all environments; configuration by injection; validate configuration at start-up.
    audit_requirement: Configuration changes are versioned and attributable.
    priority: low
    monitoring:
      - source: platform
        signal: "configuration change events"
    verification:
      sources: [stage1_dataset]
      stage1_paths:
        - "infrastructure.workloads[].containers[].env_from_configmaps"
        - "repositories[].secrets.sourced_from[].mechanism"
      criteria: Configuration reaches containers through ConfigMap or secret references rather than literal values in the image.
  - id: SEC-007
    title: Least-privilege workload identity
    requirement: Workloads run under a dedicated service account with minimal permissions, as a non-root user, and reach cloud APIs through workload identity rather than static keys.
    best_practice: One service account per workload; drop capabilities; read-only root filesystem; no static cloud keys in secrets.
    audit_requirement: Service account bindings are reviewed on a schedule.
    priority: medium
    monitoring:
      - source: platform
        signal: "cloud audit logs for the workload identity"
    verification:
      sources: [stage1_dataset]
      stage1_paths:
        - "infrastructure.workloads[].service_account"
        - "infrastructure.workloads[].containers[].run_as_non_root"
        - "infrastructure.dockerfiles[].user"
      criteria: Workloads set a service account other than default and run as non-root.
