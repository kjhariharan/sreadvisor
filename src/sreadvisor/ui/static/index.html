<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sreadvisor</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M8 17l5 5 11-12' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/analyze" aria-label="sreadvisor home">
      <span class="logo" aria-hidden="true"></span>
      <span>sreadvisor</span>
    </a>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/analyze" data-nav="analyze">Analyze</a>
      <a href="#/reports" data-nav="reports">Reports</a>
      <a href="#/catalogue" data-nav="catalogue">NFR catalogue</a>
      <a href="#/jobs" data-nav="jobs">Jobs</a>
    </nav>
    <div class="topbar-right">
      <a id="job-pill" class="pill pill-run" href="#/jobs" hidden>Job running</a>
      <span id="model-pill" class="pill" title="Model backend used for the LLM steps">model</span>
    </div>
  </header>
  <main id="view" class="view" tabindex="-1"></main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>
  <datalist id="dl-paths"></datalist>
  <datalist id="dl-entries"></datalist>
  <script src="/static/core.js"></script>
  <script src="/static/analyze.js"></script>
  <script src="/static/reports.js"></script>
  <script src="/static/catalogue.js"></script>
  <script src="/static/jobs.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
