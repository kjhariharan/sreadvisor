[project]
name = "sreadvisor"
version = "0.1.0"
description = "SRE readiness advisor: code + infra analysis, consolidated into a facts-only dataset per service."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "google-adk",
    "google-genai",
    "litellm",
    "graphifyy",
    "pydantic>=2",
    "pyyaml",
    "python-hcl2",
    "mcp>=2.2.0",
    "fastapi",
    "uvicorn",
    "httpx",
    "python-dotenv",
]

[project.scripts]
sreadvisor = "sreadvisor.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sreadvisor"]

[tool.uv]
package = true

# Standalone workspace root: stops uv from adopting the pyproject.toml in the
# user's home directory as a parent workspace.
[tool.uv.workspace]
members = []

[tool.pytest.ini_options]
testpaths = ["tests"]
