# Per-service configuration: fill in once, then run
#   uv run sreadvisor analyze --config config/petclinic.yaml
# Relative paths resolve against this file's directory.

service_name: adservice

code_repos:                       # one or more repository paths (or git URLs)
  - path: ../../../microservices-demo/src/adservice

iac_paths:                        # infrastructure-as-code paths, separate from the code repos
  - ../../../microservices-demo     # Pet Clinic keeps k8s/, docker-compose.yml and CI workflows in the repo

observability:
  provider: dynatrace             # any provider enabled in the registry
  service_id: SERVICE-0123456789ABCDEF   # placeholder: replace with the real Dynatrace service id
  options:
    environment_url: https://abc12345.live.dynatrace.com
    api_token: DT_API_TOKEN   # name of the env var holding the token; never put the token in this file

output_dir: ../output
